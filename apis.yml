name: Shelter
description: >-
  Shelter is a read-only AI money guardian from Nextaura Labs that connects to a user's financial
  accounts through Plaid and publishes a 30-day cash-flow forecast, safe-to-spend and affordability
  checks, bill and subscription detection, and low-balance alerts. Its agent surface is an official
  open-source MCP server (npm @shelter.money/mcp, ten read-only tools with an MCP-registry
  server.json) backed by a scoped-API-key Agent API; the documented API host api.shelter.money was
  NXDOMAIN at probe time (2026-09-07), so the live API could not be reached.
