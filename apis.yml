  description: >-
    Official read-only MCP agent surface for the Shelter budgeting product — ten tools covering
    status, runway, forecast, alerts, opportunities, context, affordability, coaching, and Guardian
    Q&A, shipped as the open-source npm package @shelter.money/mcp (stdio transport) and
    authenticated with a scoped API key. The declared backing base https://api.shelter.money/agent
    is the provider's own documented default (SHELTER_API_URL), but the host did not resolve
    (NXDOMAIN) when probed on 2026-09-07.
